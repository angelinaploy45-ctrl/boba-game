<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boba Cat Catcher</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="ui">
            <div class="score-board">Score: <span id="score">0</span></div>
            <div class="timer">Time: <span id="time">60</span>s</div>
            <div class="level-board">Level: <span id="level">1</span></div>
        </div>

        <div id="start-screen" class="screen">
            <h1>Boba Cat Catcher 🐱🧋</h1>
            <p>ช่วยน้องแมวเก็บไข่มุก (+10) 👑ไข่มุกทอง (+50) ระวังมะนาว (-15) วิ่งเต็มจอไปเลย!</p>
            <p>กดปุ่มลูกศร ⬅️ ➡️ เพื่อบังคับ</p>
            <button id="start-btn">Start Game</button>
        </div>

        <div id="game-over-screen" class="screen hidden">
            <h1>Time's Up!</h1>
            <p>Your Score: <span id="final-score">0</span></p>
            <button id="restart-btn">Play Again</button>
        </div>

        <div id="player" class="hidden"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
